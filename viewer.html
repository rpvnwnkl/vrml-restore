<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VRML Viewer</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/x_ite@12.1.0/dist/x_ite.css">
  <script src="https://cdn.jsdelivr.net/npm/x_ite@12.1.0/dist/x_ite.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    x3d-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    nav {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 12px;
      padding: 8px 10px;
      background: rgba(0,0,0,.72);
      color: white;
      border-radius: 6px;
    }

    nav a, nav button {
      color: white;
      font: inherit;
    }

    nav button {
      margin-left: 10px;
      background: none;
      border: 1px solid #888;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">← all scenes</a>
    <span id="name"></span>
    <button id="fullscreen">Full screen</button>
  </nav>

  <x3d-canvas id="viewer"></x3d-canvas>

  <script>
    const params = new URLSearchParams(location.search);
    const scene = params.get("scene") || "bothalabamas.wrl";

    document.querySelector("#name").textContent = "  " + scene;
    document.title = scene + " — VRML Archive";
    document.querySelector("#viewer").setAttribute("src", "modern/" + scene);

    function fullscreen() {
      document.documentElement.requestFullscreen?.();
    }

    document.querySelector("#fullscreen").addEventListener("click", fullscreen);

    document.addEventListener("keydown", event => {
      if (event.key.toLowerCase() === "f")
        fullscreen();
    });
  </script>
</body>
</html>
